services:
  postgres:
    image: postgres:16-alpine
    container_name: pdi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pdi
      POSTGRES_PASSWORD: pdi
      POSTGRES_DB: pdi
    ports:
      - "5432:5432"
    volumes:
      - pdi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdi -d pdi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pdi_postgres_data:

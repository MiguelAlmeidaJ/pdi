# Local connections inside the PostgreSQL container.
local   all             all                                     trust

# Require password authentication for TCP connections, including requests
# originating from the host through Docker's bridge network.
host    all             all             0.0.0.0/0               scram-sha-256
host    all             all             ::/0                    scram-sha-256

# Replication connections follow the same authentication policy.
local   replication     all                                     trust
host    replication     all             0.0.0.0/0               scram-sha-256
host    replication     all             ::/0                    scram-sha-256
